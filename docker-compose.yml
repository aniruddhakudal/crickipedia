services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crickipedia
      POSTGRES_PASSWORD: crickipedia
      POSTGRES_DB: crickipedia
    ports:
      - "5432:5432"
    volumes:
      - crickipedia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crickipedia -d crickipedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crickipedia_pg:
